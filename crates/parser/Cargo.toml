[package]
name = "onenote_parser"
version = "1.1.0"
authors = ["Markus Siemens <markus@m-siemens.de>"]
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
readme = "../../README.md"
repository = "https://github.com/msiemens/onenote.rs"
description = "A parser for Microsoft OneNote® files"
keywords = ["onenote", "parser"]
categories = ["parser-implementations"]

[features]
default = ["native-fs"]
backtrace = []
native-fs = []
onepkg = ["dep:cab"]

[dependencies]
bytes = "1.11"
encoding_rs = "0.8"
enum-primitive-derive = "0.3"
itertools = "0.14"
log = "0.4"
num-traits = "0.2"
sanitise-file-name = "1.0"
thiserror = "2.0"
uuid = "1.19"
widestring = "1.2"

parser-macros = { workspace = true }
cab = { version = "0.6", optional = true }

[dev-dependencies]
insta = "1.45"
tempfile = "3.15"
yare = "3.0.0"

[lib]
crate-type = ["cdylib", "lib"]
